[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "kuvy"
version = "1.3.0"
description = "Lightweight project manager for Python, inspired in Cargo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomli-w",
    "kopilogs",
]

[project.scripts]
kuvy = "kuvy:main.main"

[tool.kuvy.run]
main = "src/kuvy/main.py"
tests = "tests/tests.py"
